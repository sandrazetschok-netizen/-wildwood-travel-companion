<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandra, die Malamuten und der Bus</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="hero">

    <div class="overlay">

        <h1>🌲 Sandra,<br>die Malamuten<br>und der Bus</h1>

        <p>Bereit für das nächste Abenteuer.</p>

        <button>🚐 Neue Reise</button>

        <button class="secondary">
            📦 Packliste öffnen
        </button>

    </div>

</header>

<main>

<section class="card">

<h2>🚐 Nächste Reise</h2>

<p>Noch keine Reise geplant.</p>

</section>

<section class="card">

<h2>📦 Packstatus</h2>

<progress value="0" max="100"></progress>

<p>0 % gepackt</p>

</section>

<section class="grid">

<div class="tile">📦 Packliste</div>

<div class="tile">🐺 Hunde</div>

<div class="tile">🌦 Wetter</div>

<div class="tile">💶 Reisekosten</div>

</section>

</main>

<nav>

<div>🏠</div>

<div>📦</div>

<div>🐺</div>

<div>🚐</div>

<div>⚙️</div>

</nav>

<script src="app.js"></script>

</body>
</html>
